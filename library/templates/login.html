<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form method="POST" action="/login/">
        {% csrf_token %}
        <label>Username:</label><br>
        <input type="text" name="username"><br><br>
        <label>Password:</label><br>
        <input type="password" name="password" autocomplete="off"><br><br>
        <button type="submit">Login</button>
    </form>
</body>
</html>
