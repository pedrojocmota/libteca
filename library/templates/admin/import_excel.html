{% extends "admin/base_site.html" %}
{% block content %}
<h1>Importar Livros via Excel</h1>
<p>Faz upload de um ficheiro Excel do PNL. O sistema ignora automaticamente livros duplicados.</p>
<p>O ficheiro deve ter as colunas: <strong>ISBN</strong>, <strong>Título</strong>, <strong>Autor(es)</strong></p>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div>
        <label for="excel_file">Ficheiro Excel (.xlsx):</label><br><br>
        <input type="file" name="excel_file" accept=".xlsx" required>
    </div>
    <br>
    <input type="submit" value="Importar Livros" class="default">
</form>

<br>
<a href="../">← Voltar à lista de livros</a>
{% endblock %}
